name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PLUGINVAL_VERSION: v1.0.4
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Stage VST3 bundle
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Path build -Recurse -Directory -Filter "Transcriber.vst3" |
                    Where-Object { $_.FullName -match '\\Release\\VST3\\' } | Select-Object -First 1
          if (-not $bundle) { throw "Transcriber.vst3 was not found in the build output." }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse $bundle.FullName dist/
          "VST3_PATH=$((Resolve-Path dist/Transcriber.vst3).Path)" >> $env:GITHUB_ENV
          Get-ChildItem -Recurse dist | Select-Object FullName, Length

      - name: Pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/Tracktion/pluginval/releases/download/$env:PLUGINVAL_VERSION/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          # pluginval.exe is a GUI-subsystem app, so PowerShell would not wait for it or set
          # $LASTEXITCODE; Start-Process -Wait gives the real exit code.
          $p = Start-Process -FilePath ./pluginval/pluginval.exe -NoNewWindow -Wait -PassThru `
                 -ArgumentList @("--strictness-level", "5", "--verbose", "--validate", "`"$env:VST3_PATH`"")
          if ($p.ExitCode -ne 0) { throw "pluginval failed with exit code $($p.ExitCode)" }
          Write-Host "pluginval passed"

      - name: Upload VST3
        uses: actions/upload-artifact@v7
        with:
          name: Transcriber-VST3
          path: dist/
          if-no-files-found: error
